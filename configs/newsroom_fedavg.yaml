# Flagship: summary extractiveness (fragment density) on Newsroom, publications as clients.
# Participants = rotation `rotation` of data/newsroom_fed/clients.json (8 of 12; 4 held out).
#
# Backbone per plan: Qwen/Qwen3-4B-Instruct-2507 (not yet in the HF cache; download first).
# Pipeline pilot on the cached 1B model:
#   python train_fed.py --config configs/newsroom_fedavg.yaml \
#       --set model_name=meta-llama/Llama-3.2-1B-Instruct out_dir=runs/nr_pilot_llama1b
model_name: Qwen/Qwen3-4B-Instruct-2507
data_path: data/newsroom_fed/data.jsonl
clients_file: data/newsroom_fed/clients.json
rotation: 0
clients: null
out_dir: runs/newsroom_fedavg_rot0
max_train_per_client: 2000     # data-budget study: 64 / 256 / 2000
tie_break: average
# How alpha is computed from the attribute score (fedsteer/data.py):
#   global: percentile under the equal-weight mixture of the participants' CDFs (shared
#           protocol; alpha means the same behavior on every client)   <- method
#   local:  percentile under each client's own CDF (ablation)
alpha_mode: global
system_prompt: null
max_prompt_tokens: 1024        # articles are truncated to 400 words at build time
max_target_tokens: 128
grad_checkpointing: true
attn_implementation: sdpa

lora:
  rank_private: 16
  rank_shared: 16
  lora_alpha_private: 16
  lora_alpha_shared: 16
  shared_seed: 1234
  gain_min: 0.25
  gain_max: 4.0
  # Private monotone reparameterization of alpha: coefficient = s_i * h_i(alpha)
  # (fedsteer/warp.py).  none = original linear model (ablation).
  #   kumaraswamy      (A) h = 1 - (1 - a^p)^q                     2 params
  #   kumaraswamy_mix  (B) h = (1 - w) a + w [1 - (1 - a^p)^q]      3 params  <- method
  #   step             (C) h = (1 - w) a + w S((a - c) / tau)       3 params, c = switch point
  # Option F (post-hoc isotonic remap, no training change): eval_direction.py --posthoc_remap
  warp: kumaraswamy_mix
  offset: true                # private offset o_i: coefficient = o_i + s_i * h_i(alpha)
  offset_max: 2.0
  warp_shape_min: 0.2
  warp_shape_max: 20.0
  warp_mix_w_init: 0.5
  warp_step_c_init: 0.5
  warp_step_tau_init: 0.2

fed:
  mode: fedavg
  adapter: private            # private (method) | shared (A2) | none
  rounds: 50
  local_steps: 20
  batch_size: 8
  grad_accum: 1
  lr_private: 2.0e-4
  lr_shared: 2.0e-4
  lr_gain: 1.0e-2
  warmup_steps: 20
  gain_warmup_rounds: 2
  lr_warp: 1.0e-2
  warp_warmup_rounds: 5       # h_i stays the identity until D carries signal
  warp_reg: 1.0e-2            # penalty mean (h(a) - a)^2 toward the identity
  save_every: 10
  seed: 0

# Held-out monitoring (fedsteer/monitor.py): dev loss every round, and a small
# steering check (20 dev articles x 3 alphas, greedy) every `steer_every` rounds.
monitor:
  split: dev
  loss_every: 1
  loss_max_examples: 100
  steer_every: 5
  steer_prompts: 20
  steer_alphas: [0.1, 0.5, 0.9]
  scorer: density
  max_new_tokens: 96
  batch_size: 16
