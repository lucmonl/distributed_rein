# MOL-24 pre-flight smoke ONLY (2 clients, 3 rounds, 64 train examples). NOT an experiment
# config: warp/gain warmup are shortened so the warp and offset paths actually run inside 3
# rounds. Clients are listed here rather than passed through --export because a comma inside
# an --export value is silently truncated (MOL-22b, cause 2).
model_name: Qwen/Qwen3-4B-Instruct-2507
data_path: data/chembl_deco_skew_pruned/data.jsonl
clients_file: data/chembl_deco_skew_pruned/clients.json
rotation: 0
clients:
- CHEMBL243
- CHEMBL228
out_dir: runs/mol24-smoke
max_train_per_client: 64
tie_break: average
alpha_mode: global
system_prompt: null
chat_template_kwargs:
  enable_thinking: false
max_prompt_tokens: 320
max_target_tokens: 192
grad_checkpointing: true
attn_implementation: sdpa
lora:
  rank_private: 16
  rank_shared: 16
  lora_alpha_private: 16
  lora_alpha_shared: 16
  dropout: 0.0
  shared_seed: 1234
  gain_min: 0.25
  gain_max: 4.0
  warp: kumaraswamy_mix
  offset: false
  offset_max: 2.0
  warp_shape_min: 0.2
  warp_shape_max: 20.0
  warp_mix_w_init: 0.5
  warp_step_c_init: 0.5
  warp_step_tau_init: 0.2
fed:
  mode: fedavg
  adapter: private
  calibration: private
  rounds: 3
  local_steps: 3
  batch_size: 8
  grad_accum: 1
  lr_private: 0.0002
  lr_shared: 0.0002
  lr_gain: 0.01
  warmup_steps: 20
  gain_warmup_rounds: 1
  lr_warp: 0.01
  warp_warmup_rounds: 1
  warp_reg: 0.01
  save_every: 1
  seed: 0
reg:
  private_wd: 0.0
  shared_wd: 0.0
  decorr: 0.0
  fedprox_mu: 0.0
  gain_l2: 0.0
  offset_l2: 0.0
monitor:
  split: dev
  loss_every: 1
  loss_max_examples: 16
  full_every: 2
  full_prompts: 4
  full_alphas:
  - 0.0
  - 0.25
  - 0.5
  - 0.75
  - 1.0
  full_max_new_tokens: 96
  full_batch_size: 32
  steer_every: 0
  steer_prompts: 20
  steer_alphas:
  - 0.1
  - 0.5
  - 0.9
  scorer: clogp_residual_deco_strict
  max_new_tokens: 96
  batch_size: 16
